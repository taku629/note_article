# topic_categories.yaml
# カテゴリ別トピック管理ファイル
# 更新: 2026-04-26 大学2年・等身大方針に全面改訂
#
# 使い方:
#   - priority: high/normal/low で trend_selector.py の候補優先度を手動調整
#   - 週次振り返りで「伸びたカテゴリ」を high に、低調なカテゴリを low に変更する
#   - 将来的に records.csv の likes 平均から自動更新も可能

categories:

  AI活用（ツール・自動化・実験）:
    priority: high   # 旬度が最も高い／試行錯誤ベースで書きやすい
    topics:
      - "Claudeに勉強計画を立ててもらったら意外とちゃんと機能した話"
      - "AIツールを使いこなすだけで「バイト以外の選択肢」が増えた気がする話"
      - "大学生がnoteを自動投稿する仕組みを1ヶ月回してみた正直な結果"
      - "ChatGPTで大学のレポートを書いたらバレそうになった話と反省"
      - "AIにバイトのシフト管理と収支記録をやらせてみた話"

  お金（奨学金・生活費・失敗）:
    priority: high   # 共感・不安ベースでいいねが取れやすい
    topics:
      - "大学2年生の1ヶ月の生活費を全部公開する（奨学金＋バイトのリアル）"
      - "奨学金230万を借りている大学2年が、お金の勉強を早く始めればよかったと思う3つのこと"
      - "月収3万のバイト生活から固定費を削って貯金を作るまでの記録"
      - "大学生がサブスク全部解約したら月4,000円浮いた話と見直し手順"

  副業・発信（試行錯誤中）:
    priority: normal  # 「やってみている途中」に限定。結果を断言しない
    topics:
      - "「副業に興味はあるけど何から手をつければいいかわからない」という状態のまま3ヶ月経ったレポート"
      - "大学生がnoteを自動投稿する仕組みを1ヶ月回してみた正直な結果"

  キャリア準備（インターン・不安・実験）:
    priority: normal  # 本選考・内定・就職は書かない。準備・不安・実験のみ
    topics:
      - "大学2年でインターンに応募してみたら面接でボコボコにされた話"
      - "ESをClaudeに5回書いてもらったら、だんだん「ぼくっぽくない文章」になってきた話"
      - "「就活、何もしてないけど大丈夫？」大学2年の正直な不安を書く"
      - "自己PRを書こうとしたら「ガクチカ」が何もなかった話"
      - "AIに自己分析させてみたら「そんなやつだったの？」という結果になった"
      - "インターン選考で落ちまくって気づいた、ぼくに足りなかったもの"
      - "就活の軸を決めようとしたら「やりたいこと」が何もなかった話"
      - "大学2年でOB訪問してみたら価値観が変わった3つのこと"
      - "AIで企業研究したらESの質が上がった気がしたので方法をまとめる"
      - "就活まで2年ある大学2年生が「今のうちにやっておいて正解だった」と思うこと"

  バイト・大学生活:
    priority: normal
    topics:
      - "大学2年生の1ヶ月の生活費を全部公開する（奨学金＋バイトのリアル）"
      - "AIにバイトのシフト管理と収支記録をやらせてみた話"
      - "月収3万のバイト生活から固定費を削って貯金を作るまでの記録"

# ──────────────────────────────────────────
# NG ワードルール（trend_selector.py の _OVERCONFIDENT_WORDS で実装）
# ──────────────────────────────────────────
#
# 以下のワードを含む候補は自動除外される（大学2年の立場で「盛りすぎ」になるため）
#   内定 / 年収 / 達成 / フリーランス案件 / 受注 / 大手を蹴って / 全振り / 末路
#
# ──────────────────────────────────────────
# カテゴリ多様性ルール
# ──────────────────────────────────────────
#
# ① 直近7日で同カテゴリが3回続いたら、そのカテゴリの候補を除外する
# ② 直近14日で同キーワードを含むタイトルを避ける（_topic_is_fresh() 対応済み）
# ③ キャリア準備カテゴリは「不安・準備・試してみた」方向のみ通す
